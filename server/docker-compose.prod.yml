services:
  api:
    build: .
    container_name: organizer-api
    # uid 10000 has no account on the host (2026-10-06): a container escape lands
    # on nobody, not on `ubuntu` (sudo + docker group) as uid 1000 did.
    user: "10000:10000"
    restart: unless-stopped
    ports:
      # Loopback only (2026-10-05): every client goes through
      # https://organizer.mickaelfm.me; the public IP:3001 was plain HTTP.
      - "127.0.0.1:3001:3001"
    environment:
      - VIRTUAL_HOST=organizer.mickaelfm.me
      - VIRTUAL_PORT=3001
      - LETSENCRYPT_HOST=organizer.mickaelfm.me
      - LETSENCRYPT_EMAIL=faivrem@gmail.com
      - NODE_ENV=production
      - PORT=3001
      - MONGODB_URI=${MONGODB_URI:?set in .env}
      # was: mongodb://organizer:<password>@mongodb:27017/organizer?authSource=admin&directConnection=true
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - LOG_DIR=/app/logs
      - MCP_URL=http://localhost:3001/mcp
      - EKO_MCP_TOKEN=${EKO_MCP_TOKEN}
    volumes:
      - uploads_data:/app/public/uploads
      - apk_data:/app/public/apk
      - logs_data:/app/logs
      - ./agent-config.json:/app/agent-config.json:ro
    networks:
      - organizer-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

# mongodb & qdrant are NOT declared here: their containers are managed by the
# separate `infra` project (/opt/infra/docker-compose.yml) with the real config
# (mongo replSet + TLS + keyfile). This project stays the owner of the network
# and the volumes below, which infra references as external. Declaring the
# containers here too caused a name conflict that silently aborted every deploy.

networks:
  organizer-network:
    external: true
    name: net-organizer

volumes:
  mongodb_data:
  uploads_data:
  apk_data:
  logs_data:
  qdrant_data:
