services:
  api:
    build: .
    container_name: organizer-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGODB_URI=mongodb://organizer:73dbed3c1c89dd83ff8a057619681c69@mongodb:27017/organizer?authSource=admin&directConnection=true
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - QDRANT_URL=http://qdrant:6333
      - LOG_DIR=/app/logs
      - MCP_URL=http://localhost:3001/mcp
      - EKO_MCP_TOKEN=${EKO_MCP_TOKEN}
    volumes:
      - uploads_data:/app/public/uploads
      - apk_data:/app/public/apk
      - logs_data:/app/logs
      - ./agent-config.json:/app/agent-config.json:ro
    networks:
      - organizer-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

# mongodb & qdrant are NOT declared here: their containers are managed by the
# separate `infra` project (/opt/infra/docker-compose.yml) with the real config
# (mongo replSet + TLS + keyfile). This project stays the owner of the network
# and the volumes below, which infra references as external. Declaring the
# containers here too caused a name conflict that silently aborted every deploy.

networks:
  organizer-network:
    driver: bridge

volumes:
  mongodb_data:
  uploads_data:
  apk_data:
  logs_data:
  qdrant_data:
